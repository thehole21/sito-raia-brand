server {
    listen 80;
    listen [::]:80;
    server_name stats.raiaweb.it;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; try_files $uri =404; }
    location / { return 308 https://stats.raiaweb.it$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stats.raiaweb.it;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/stats.raiaweb.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.raiaweb.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 64k;
    access_log off;
    gzip on;
    gzip_types application/javascript application/json text/css;
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
    location = /api/auth/login {
        limit_req zone=raia_stats_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
