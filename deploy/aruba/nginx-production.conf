server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 308 https://www.raiaweb.it$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name raiaweb.it;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/raiaweb.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raiaweb.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://www.raiaweb.it$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.raiaweb.it;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/raiaweb.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raiaweb.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RAIATLS:10m;
    ssl_session_timeout 1d;
    client_max_body_size 10m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
